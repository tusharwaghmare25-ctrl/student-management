
name: Student Management CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Project Files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "Student Management System CI Successful!"
